name: Update Asset URLs

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release assets and generate JSON
        id: get_assets
        run: |
          # 1. Obtener la URL de la última release (usando el repositorio correcto)
          REPO="${{ github.repository }}"
          echo "Repositorio: $REPO"
          
          # Si no se especifica, usar ps5xploit/ps5shopappkg (por si acaso)
          if [ -z "$REPO" ] || [ "$REPO" = "ps5shopappkg/shellshops" ]; then
            REPO="ps5xploit/ps5shopappkg"
            echo "⚠️ Repositorio corregido a: $REPO"
          fi
          
          API_URL="https://api.github.com/repos/$REPO/releases/latest"
          echo "Obteniendo datos de: $API_URL"
          
          # 2. Obtener los datos de la release
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL")
          
          # Verificar si la respuesta es válida
          if echo "$RESPONSE" | jq -e '.message' > /dev/null 2>&1; then
            echo "❌ Error al obtener la release: $(echo "$RESPONSE" | jq -r '.message')"
            exit 1
          fi
          
          # Extraer solo los assets (array)
          ASSETS=$(echo "$RESPONSE" | jq -c '.assets // []')
          
          # 3. Filtrar solo los archivos .pkg y generar games.json
          echo "$ASSETS" | jq '[.[] | select(.name | endswith(".pkg")) | {name: .name, url: .browser_download_url}]' > games.json
          
          # 4. Mostrar cuántos .pkg se encontraron
          COUNT=$(jq '. | length' games.json)
          echo "✅ Se encontraron $COUNT assets .pkg."
          
          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ No se encontraron archivos .pkg en la última release."
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Update asset URLs" || echo "No changes to commit"
          git push
