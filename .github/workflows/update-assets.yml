name: Update Asset URLs

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get ALL .pkg assets from ALL releases
        run: |
          # Forzar el repositorio correcto
          REPO="ps5xploit/ps5shopappkg"
          echo "📦 Repositorio: $REPO"
          
          PAGE=1
          ALL_ASSETS="[]"
          
          while true; do
            echo "📄 Obteniendo releases página $PAGE..."
            RELEASES=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/$REPO/releases?per_page=100&page=$PAGE")
            
            # Si no hay más releases, salir
            COUNT=$(echo "$RELEASES" | jq '. | length')
            if [ "$COUNT" -eq 0 ]; then
              echo "✅ No hay más releases."
              break
            fi
            
            # Extraer assets .pkg de esta página
            ASSETS=$(echo "$RELEASES" | jq '[.[].assets[] | select(.name | endswith(".pkg"))]')
            NEW_COUNT=$(echo "$ASSETS" | jq '. | length')
            echo "   Encontrados $NEW_COUNT assets .pkg en esta página."
            
            # Añadir al total
            ALL_ASSETS=$(echo "$ALL_ASSETS" | jq --argjson new "$ASSETS" '. + $new')
            PAGE=$((PAGE + 1))
          done
          
          # Eliminar duplicados (por si un mismo asset aparece en varias releases)
          ALL_ASSETS=$(echo "$ALL_ASSETS" | jq 'unique_by(.name)')
          
          # Generar games.json
          echo "$ALL_ASSETS" | jq '[.[] | {name: .name, url: .browser_download_url}]' > games.json
          
          TOTAL=$(jq '. | length' games.json)
          echo "✅ TOTAL: $TOTAL archivos .pkg encontrados en todas las releases."
          
          # Mostrar los nombres (para depuración)
          echo "📋 Lista de archivos encontrados:"
          jq -r '.[].name' games.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Update asset URLs from all releases" || echo "No changes to commit"
          git push
