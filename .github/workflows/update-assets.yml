name: Update Asset URLs

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release assets and generate JSON
        run: |
          # Determinar la URL correcta según el evento
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_ID="${{ github.event.release.id }}"
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets"
          else
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          fi

          echo "Fetching assets from: $API_URL"

          # Obtener los datos completos
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL")

          # Si es la última release, extraer solo el array de assets
          if [ "${{ github.event_name }}" != "release" ]; then
            ASSETS=$(echo "$RESPONSE" | jq '.assets')
          else
            ASSETS="$RESPONSE"
          fi

          # Verificar que ASSETS no sea null o vacío
          if [ -z "$ASSETS" ] || [ "$ASSETS" = "null" ]; then
            echo "Error: Could not fetch assets."
            exit 1
          fi

          # Filtrar solo los que terminan en .pkg (case insensitive)
          # y generar el JSON
          echo "$ASSETS" | jq '[.[] | select(.name | test("\\.pkg$"; "i")) | {name: .name, url: .browser_download_url}]' > games.json

          # Mostrar cuántos se encontraron
          COUNT=$(jq '. | length' games.json)
          echo "✅ games.json generated with $COUNT .pkg assets."

          # Si no hay .pkg, mostrar advertencia
          if [ "$COUNT" -eq 0 ]; then
            echo "⚠️ No .pkg assets found in this release."
          fi

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Update asset URLs" || echo "No changes to commit"
          git push
