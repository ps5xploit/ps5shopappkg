name: Update Asset URLs

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  update-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release assets and generate JSON
        run: |
          # Determinar la URL correcta según el evento
          if [ "${{ github.event_name }}" = "release" ]; then
            RELEASE_ID="${{ github.event.release.id }}"
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets"
          else
            # Para workflow_dispatch, obtener la última release
            API_URL="https://api.github.com/repos/${{ github.repository }}/releases/latest"
          fi

          echo "Fetching assets from: $API_URL"

          # Obtener los datos
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$API_URL")

          # Si es la última release, extraer solo el array de assets
          if [ "${{ github.event_name }}" != "release" ]; then
            RESPONSE=$(echo "$RESPONSE" | jq '.assets')
          fi

          # Verificar que RESPONSE no sea null o vacío
          if [ -z "$RESPONSE" ] || [ "$RESPONSE" = "null" ]; then
            echo "Error: Could not fetch assets."
            exit 1
          fi

          # Generar games.json
          echo "$RESPONSE" | jq '[.[] | {name: .name, url: .browser_download_url}]' > games.json
          echo "✅ games.json generated successfully."

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add games.json
          git commit -m "Update asset URLs" || echo "No changes to commit"
          git push
