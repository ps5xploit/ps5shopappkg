name: Update Asset URLs

on:
  release:
    types: [published] # Se ejecuta cuando se publica una nueva release

jobs:
  update-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get release assets
        id: get_assets
        run: |
          # Obtener los assets de la release que activó el workflow
          ASSETS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/${{ github.event.release.id }}/assets")
          
          # Procesar y generar un archivo JSON con las URLs
          echo "$ASSETS" | jq '.[] | {name: .name, url: .browser_download_url}' > assets.json
          
          # También puedes generar un archivo .js con el formato que necesites
          echo "const GAMES_URLS = " > games_urls.js
          echo "$ASSETS" | jq '[.[] | {name: .name, url: .browser_download_url}]' >> games_urls.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets.json games_urls.js
          git commit -m "Update asset URLs" || echo "No changes to commit"
          git push
