name: Generate GitHub URLs JSON

on:
  workflow_dispatch:

jobs:
  generate-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
          && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt update \
          && sudo apt install gh -y

      - name: Generate JSON from all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obtener todos los releases con sus assets en un solo JSON
          echo "📡 Obteniendo releases..."
          gh release list --limit 1000 --json tagName,assets > releases_raw.json
          
          # Procesar con jq para construir el JSON final
          jq '
            {
              totalGames: length,
              totalFiles: (map(.assets | length) | add),
              failedCount: 0,
              failedIds: [],
              games: map({
                key: .tagName,
                value: (.assets // [] | map({
                  gameId: .tagName,
                  fileName: .name,
                  url: .browser_download_url,
                  size: (.size // 0 | tonumber),
                  downloadCount: (.download_count // 0 | tonumber)
                }))
              }) | from_entries,
              allFiles: [.[] | .assets[]? | {
                gameId: .tagName,
                fileName: .name,
                url: .browser_download_url,
                size: (.size // 0 | tonumber),
                downloadCount: (.download_count // 0 | tonumber)
              }]
            }
          ' releases_raw.json > github_urls.json
          
          # Añadir fecha al nombre
          date_suffix=$(date +'%Y-%m-%d')
          mv github_urls.json "GITHUB_URLS_${date_suffix}.json"
          
          echo "✅ JSON generado: GITHUB_URLS_${date_suffix}.json"
          
          # Mostrar estadísticas
          jq '. | "📊 Total juegos: \(.totalGames), 📄 Total archivos: \(.totalFiles)"' "GITHUB_URLS_${date_suffix}.json"

      - name: Upload JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-urls-json
          path: GITHUB_URLS_*.json

      - name: Commit and push JSON to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add GITHUB_URLS_*.json
          if git diff --staged --quiet; then
            echo "No hay cambios para subir."
          else
            git commit -m "📊 Actualizar GITHUB_URLS_$(date +'%Y-%m-%d').json"
            git push
            echo "✅ JSON subido al repositorio."
          fi
