name: Move ALL images to /images

on:
  workflow_dispatch:  # Lo ejecutas manualmente desde Actions

jobs:
  move-all-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move ALL image files from root to images/
        run: |
          # Crear la carpeta images si no existe
          mkdir -p images

          # Buscar TODOS los archivos de imagen en la RAÍZ (sin entrar en subcarpetas)
          # y moverlos a images/
          find . -maxdepth 1 -type f \( \
            -iname "*.jpg" -o \
            -iname "*.jpeg" -o \
            -iname "*.png" -o \
            -iname "*.gif" -o \
            -iname "*.svg" -o \
            -iname "*.webp" -o \
            -iname "*.bmp" -o \
            -iname "*.ico" \
          \) -exec mv -v {} images/ \;

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          # Si hay cambios, los subimos
          if git diff --staged --quiet; then
            echo "No hay imágenes nuevas para mover."
          else
            git commit -m "Mover TODAS las imágenes de la raíz a /images"
            git push
          fi
