name: Delete ALL Action Runs

on:
  workflow_dispatch:

jobs:
  delete-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write

    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          echo "🔍 Obteniendo todas las ejecuciones de Actions..."
          page=1
          total_deleted=0

          while true; do
            echo "📄 Obteniendo página $page..."
            
            # Obtener los IDs de los runs de esta página
            response=$(curl -s -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100&page=$page")
            
            # Extraer IDs con jq (debe estar instalado por defecto)
            run_ids=$(echo "$response" | jq -r '.workflow_runs[].id')
            
            # Si no hay IDs, salimos
            if [ -z "$run_ids" ] || [ "$run_ids" = "null" ]; then
              echo "✅ No hay más ejecuciones."
              break
            fi
            
            # Eliminar cada run
            for id in $run_ids; do
              echo "  🗑️  Eliminando run $id..."
              curl -X DELETE -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/${{ github.repository }}/actions/runs/$id"
              total_deleted=$((total_deleted + 1))
            done
            
            page=$((page + 1))
          done

          echo "🎉 Total de ejecuciones eliminadas: $total_deleted"
