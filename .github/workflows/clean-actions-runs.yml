name: Clean All Actions Runs

on:
  workflow_dispatch:   # Solo manual

jobs:
  clean-runs:
    runs-on: ubuntu-latest
    permissions:
      actions: write   # Necesario para borrar ejecuciones

    steps:
      - name: Delete all workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obtener todas las ejecuciones (pagina hasta que no haya más)
          page=1
          while true; do
            echo "📄 Obteniendo página $page..."
            runs=$(gh api repos/${{ github.repository }}/actions/runs?per_page=100&page=$page --jq '.workflow_runs[].id')
            
            if [ -z "$runs" ]; then
              echo "✅ No hay más ejecuciones."
              break
            fi
            
            for id in $runs; do
              echo "🗑️  Eliminando run $id..."
              gh api -X DELETE repos/${{ github.repository }}/actions/runs/$id
            done
            
            page=$((page + 1))
          done
          
          echo "✅ Limpieza completada."
