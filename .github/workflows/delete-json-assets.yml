name: Delete all .json assets from releases

on:
  workflow_dispatch:  # Ejecución manual desde la pestaña Actions

jobs:
  delete-json-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para modificar los lanzamientos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GitHub CLI
        run: |
          type -p curl >/dev/null || sudo apt install curl -y
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg \
          && sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg \
          && echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
          && sudo apt update \
          && sudo apt install gh -y

      - name: Delete all .json assets from all releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Obtener la lista de todos los lanzamientos (tags)
          releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          
          for tag in $releases; do
            echo "Procesando lanzamiento: $tag"
            
            # Obtener la lista de assets que terminan en .json para este lanzamiento
            assets=$(gh release view "$tag" --json assets --jq '.assets[].name' | grep '\.json$' || true)
            
            if [ -z "$assets" ]; then
              echo "  No hay archivos .json en este lanzamiento."
              continue
            fi
            
            # Eliminar cada asset .json
            for asset in $assets; do
              echo "  Eliminando: $asset"
              gh release delete-asset "$tag" "$asset" --yes
            done
          done
          
          echo "✅ Todos los archivos .json han sido eliminados."
